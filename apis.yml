  description: 'Undocumented, authentication-required API gateway serving the Propico web
    application. Observed on 2026-07-19: an unauthenticated GET /health returns 200 and reports a
    gateway fronting four internal services (auth-service, messaging-service, property-service,
    payment-service); every other probed path returns 401 with body {"error":"Authentication
    required"}. There is no public developer portal, documentation, OpenAPI definition or
    self-serve credential issuance - this entry records an observed private surface, not a
    published API.'
